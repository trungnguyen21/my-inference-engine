# Fronts the scaled `engine` replicas for Compose.
#
# Streaming is the whole point of this server, and nginx buffers proxied
# responses by default — which would make tokens arrive in one burst at the end
# and silently break the demo. Hence proxy_buffering off and the long timeouts.

resolver 127.0.0.11 valid=5s ipv6=off;   # Docker's embedded DNS

upstream engine_pool {
    # A shared-memory zone is required for `resolve`: re-resolving names at run
    # time means workers must share the peer list. Without it nginx refuses to
    # start ("resolving names at run time requires upstream ... to be in shared
    # memory").
    zone engine_pool 64k;

    # Docker DNS returns every replica, and `resolve` re-reads it, so scaling
    # with `docker compose up --scale engine=N` is picked up without a restart.
    #
    # least_conn rather than round robin: requests take seconds and vary in
    # length, so queue depth is a better signal than request count. Note that
    # Kubernetes' kube-proxy does NOT do this — it picks a backend at random,
    # which is why the cluster phase needs 503-and-retry.
    least_conn;
    server engine:8080 resolve;
    keepalive 16;
}

server {
    listen 8080;

    location / {
        proxy_pass http://engine_pool;
        proxy_http_version 1.1;

        # Do not buffer: SSE must reach the client token by token.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Generation can take minutes; the defaults are 60 s.
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

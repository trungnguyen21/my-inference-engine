# Identical to ../service.yaml — copied so `kubectl apply -f deploy/k8s/eks/`
# is self-contained. On EKS the NodePort is reached at
# http://<any-node-public-ip>:30080 (node IPs: kubectl get nodes -o wide),
# allowed only from the CIDR in infra/eks/terraform.tfvars.
apiVersion: v1
kind: Service
metadata:
  name: engine
spec:
  type: NodePort
  selector:
    app: engine
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
